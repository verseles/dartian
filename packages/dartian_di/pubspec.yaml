name: dartian_di
description: Dependency injection container for Dartian using get_it with auto-discovery support
version: 0.0.1

environment:
  sdk: ^3.9.4

dependencies:
  get_it: ^8.0.0
  # Annotations are part of main package (no code gen dependency for consumers)

dev_dependencies:
  test: ^1.24.0
  build_runner: ^2.4.0
  source_gen: ^1.5.0
  analyzer: ^6.4.0
