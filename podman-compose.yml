version: '3.8'
services:
  dartian:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_DRIVER=sqlite
      - PORT=8000
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dartian_dev
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
