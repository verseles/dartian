name: Dartian CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Dart ${{ matrix.dart-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-version: ['3.0.0', 'stable']

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart-version }}

      - name: Print Dart version
        run: dart --version

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Test dartian_core
        working-directory: packages/dartian_core
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_di
        working-directory: packages/dartian_di
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_router
        working-directory: packages/dartian_router
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_http
        working-directory: packages/dartian_http
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_auth
        working-directory: packages/dartian_auth
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_i18n
        working-directory: packages/dartian_i18n
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_view
        working-directory: packages/dartian_view
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_redis
        working-directory: packages/dartian_redis
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_queue
        working-directory: packages/dartian_queue
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_scheduler
        working-directory: packages/dartian_scheduler
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test dartian_orm
        working-directory: packages/dartian_orm
        run: |
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart analyze
          dart test

      - name: Test dartian_cli
        working-directory: packages/dartian_cli
        run: |
          dart pub get
          dart analyze
          dart test

  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Analyze all packages
        run: |
          for dir in packages/dartian_*/; do
            echo "Analyzing $dir..."
            cd "$dir"
            dart pub get
            dart analyze --fatal-infos || true
            cd ../..
          done

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check formatting
        run: |
          for dir in packages/dartian_*/; do
            echo "Checking format in $dir..."
            cd "$dir"
            dart format --set-exit-if-changed lib/ test/ || echo "Format issues in $dir"
            cd ../..
          done
