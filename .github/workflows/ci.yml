name: Dartian CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  # Run tests for each package in parallel using matrix
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dartian_core
          - dartian_di
          - dartian_router
          - dartian_http
          - dartian_auth
          - dartian_i18n
          - dartian_view
          - dartian_redis
          - dartian_queue
          - dartian_scheduler
          - dartian_orm
          - dartian_cli
          - dartian
        include:
          - package: dartian_orm
            needs_build_runner: true

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Run build_runner (if needed)
        if: matrix.needs_build_runner
        working-directory: packages/${{ matrix.package }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: dart test

  # Run static analysis for all packages in parallel
  analyze:
    name: Analyze ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dartian_core
          - dartian_di
          - dartian_router
          - dartian_http
          - dartian_auth
          - dartian_i18n
          - dartian_view
          - dartian_redis
          - dartian_queue
          - dartian_scheduler
          - dartian_orm
          - dartian_cli
          - dartian
        include:
          - package: dartian_orm
            needs_build_runner: true

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Run build_runner (if needed)
        if: matrix.needs_build_runner
        working-directory: packages/${{ matrix.package }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --no-fatal-warnings --no-fatal-infos lib/

  # Check code formatting
  format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check formatting
        run: dart format --set-exit-if-changed packages/

  # Publish packages to pub.dev (only on tags)
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [test, analyze, format]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # Required for OIDC authentication
    strategy:
      fail-fast: false
      max-parallel: 1  # Publish sequentially to avoid rate limits
      matrix:
        package:
          # Order matters: dependencies first
          - dartian_core
          - dartian_di
          - dartian_router
          - dartian_i18n
          - dartian_redis
          - dartian_orm
          - dartian_view
          - dartian_http
          - dartian_queue
          - dartian_scheduler
          - dartian_auth
          - dartian_cli
          - dartian
        include:
          - package: dartian_orm
            needs_build_runner: true

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: dart pub get

      - name: Run build_runner (if needed)
        if: matrix.needs_build_runner
        working-directory: packages/${{ matrix.package }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Publish to pub.dev
        working-directory: packages/${{ matrix.package }}
        run: dart pub publish --force
